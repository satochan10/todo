<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ かわいいTodo - やることリスト ✨</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <h1>🌟 やることリスト 🌟</h1>
        <button id="settingsBtn" class="settings-btn">⚙️</button>
      </div>
      <p class="subtitle">今日もがんばろう！</p>
    </header>

    <!-- パスワード入力モーダル -->
    <div id="passwordModal" class="modal">
      <div class="modal-content">
        <h2>管理者モード</h2>
        <p>パスワードを入力してください</p>
        <input type="password" id="passwordInput" placeholder="パスワード" autocomplete="off">
        <div class="modal-buttons">
          <button id="passwordOkBtn">OK</button>
          <button id="passwordCancelBtn">キャンセル</button>
        </div>
      </div>
    </div>

    <main>
      <div class="input-section">
        <div class="input-wrapper">
          <input
            type="text"
            id="todoInput"
            placeholder="やることを入力してね... ✏️"
            autocomplete="off"
          >
          <button id="addBtn" class="add-btn">➕ 追加</button>
        </div>
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">すべて</button>
        <button class="filter-btn" data-filter="active">残ってる</button>
        <button class="filter-btn" data-filter="completed">完了</button>
      </div>

      <ul id="todoList" class="todo-list">
        <!-- 動的に追加されます -->
      </ul>

      <div id="emptyState" class="empty-state">
        <p>🎉 すべて完了！お疲れ様！</p>
      </div>

      <footer class="footer">
        <button id="clearBtn" class="clear-btn">🗑️ 完了したのを削除</button>
        <p class="count">残り: <span id="count">0</span>個</p>
      </footer>
    </main>
  </div>

  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

  <script src="script.js"></script>
</body>
</html>
