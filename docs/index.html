<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ かわいいTodo - やることリスト ✨</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <button id="reloadBtn" class="reload-btn">🔄</button>
        <h1>🌟 やることリスト 🌟</h1>
        <button id="settingsBtn" class="settings-btn">⚙️</button>
      </div>
      <div class="points-display">
        <div id="pointsBadge" class="points-badge clickable">
          ⭐ <span id="pointsCount">0</span> ポイント ⭐ <span id="characterSpan">🐚</span>
        </div>
        <div id="morningBonus" class="morning-bonus" style="display: none;">
          🌅 朝の時間帯！ポイント2倍中！ 🌅
        </div>
      </div>
    </header>

    <!-- パスワード入力モーダル -->
    <div id="passwordModal" class="modal">
      <div class="modal-content">
        <h2>管理者モード</h2>
        <p>パスワードを入力してください</p>
        <input type="password" id="passwordInput" placeholder="パスワード" autocomplete="off">
        <div class="modal-buttons">
          <button id="passwordOkBtn">OK</button>
          <button id="passwordCancelBtn">キャンセル</button>
        </div>
      </div>
    </div>

    <!-- 特典モーダル -->
    <div id="rewardsModal" class="modal">
      <div class="modal-content rewards-content">
        <h2>🎁 ポイント特典</h2>
        <p id="currentPoints">現在のポイント: <strong>0</strong>P</p>
        <div class="rewards-list">
          <button id="youtubeReward" class="reward-item">
            <div class="reward-icon">📺</div>
            <div class="reward-details">
              <div class="reward-name">YouTube 30分</div>
              <div class="reward-cost">10P</div>
            </div>
          </button>
        </div>
        <button id="rewardsCloseBtn" class="rewards-close-btn">閉じる</button>
      </div>
    </div>

    <!-- 特典確認モーダル -->
    <div id="confirmRewardModal" class="modal">
      <div class="modal-content confirm-content">
        <h2>確認</h2>
        <p id="confirmRewardText">YouTube 30分に10Pを使いますか？</p>
        <div class="modal-buttons">
          <button id="confirmRewardOkBtn" class="confirm-btn confirm-ok">OK</button>
          <button id="confirmRewardCancelBtn" class="confirm-btn confirm-cancel">キャンセル</button>
        </div>
      </div>
    </div>

    <main>
      <div class="input-section">
        <div class="input-wrapper">
          <input
            type="text"
            id="todoInput"
            placeholder="やることを入力してね... ✏️"
            autocomplete="off"
          >
          <button id="addBtn" class="add-btn">➕ 追加</button>
        </div>
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">すべて</button>
        <button class="filter-btn" data-filter="active">残ってる</button>
        <button class="filter-btn" data-filter="completed">完了</button>
      </div>

      <ul id="todoList" class="todo-list">
        <!-- 動的に追加されます -->
      </ul>

      <div id="emptyState" class="empty-state">
        <p>🎉 すべて完了！お疲れ様！</p>
      </div>

      <footer class="footer">
        <button id="clearBtn" class="clear-btn">🗑️ 完了したのを削除</button>
        <p class="count">残り: <span id="count">0</span>個</p>
      </footer>
    </main>
  </div>

  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

  <script src="script.js"></script>
</body>
</html>
